<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <link rel="apple-touch-startup-image" href="/icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0f19" />
    <meta name="apple-mobile-web-app-title" content="SecondCheck" />
    <link rel="preload" as="image" href="/icon.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #0b0f19;
        color-scheme: dark;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
        background-color: #0b0f19;
      }
      /* Visible before the JS bundle loads; React replaces it on first render. */
      #startup-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0b0f19;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .startup-brand {
        position: relative;
        width: 90px;
        height: 90px;
      }
      .startup-brand img {
        display: block;
        width: 90px;
        height: 90px;
        object-fit: contain;
      }
      .startup-spinner {
        position: absolute;
        top: 114px;
        left: 35px;
        width: 20px;
        height: 20px;
        box-sizing: border-box;
        border: 2px solid #64748b40;
        border-top-color: #64748b;
        border-radius: 50%;
        animation: startup-spin 0.9s linear infinite;
      }
      .startup-tagline {
        position: absolute;
        bottom: calc(max(env(safe-area-inset-bottom, 0px), 16px) + 16px);
        left: 16px;
        right: 16px;
        margin: 0;
        color: #64748b;
        font-size: 12px;
        line-height: 18px;
        text-align: center;
      }
      @keyframes startup-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        .startup-spinner { animation: none; }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root">
      <div id="startup-splash" role="status" aria-label="SecondCheck yükleniyor">
        <div class="startup-brand">
          <img src="/icon.png" width="90" height="90" alt="SecondCheck" />
          <div class="startup-spinner" aria-hidden="true"></div>
        </div>
        <p class="startup-tagline">SecondCheck • Donanım Doğrulama</p>
      </div>
    </div>
  </body>
</html>
